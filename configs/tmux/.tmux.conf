set-environment -g TERM "tmux-256color"
set -g  default-terminal "tmux-256color"

set-option -g history-limit 5000
set-option -g status-position top

set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm' # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m' # underscore colours - needs tmux-3.0

# no confirm on kill
bind-key & kill-window
bind-key x kill-pane

# use \ to create a vertical pane & start in current dir
unbind "%"
bind "\\" split-window -h -c "#{pane_current_path}"

# use - to create a horizontal pane & start in current dir
unbind '"'
bind "-" split-window -v -c "#{pane_current_path}"

# start in current dir
bind-key c new-window -c "#{pane_current_path}"

bind -r "j" resize-pane -D 5
bind -r "k" resize-pane -U 5
bind -r "l" resize-pane -R 5
bind -r "h" resize-pane -L 5

# maximize and unmaximize pane
bind -r "m" resize-pane -Z

# Catppuccin Mocha theme
set -g mode-style "fg=#1e1e2e,bg=#89b4fa,bold"
set -g message-style "fg=#cdd6f4,bg=#313244"
set -g message-command-style "fg=#cdd6f4,bg=#313244"

set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 24
set -g status-right-length 80
set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[fg=#cba6f7,bg=#181825,nobold]█"
set -g status-left-style "bg=#181825,fg=#cdd6f4"
set -g status-right-style "bg=#181825,fg=#a6adc8"
set -g status-right "#[fg=#a6e3a1]#(~/.config/tmux/vpn_ip.sh) #[fg=#bac2de]#T "

set -g window-status-separator ""
set -g window-status-style "bg=#181825,fg=#6c7086"
set -g window-status-format "#[bg=#181825,fg=#6c7086] #I #[fg=#bac2de]#W "
set -g window-status-current-style "bg=#313244,fg=#cdd6f4,bold"
set -g window-status-current-format "#[fg=#181825,bg=#89b4fa,bold] #I #[fg=#1e1e2e]#W #[fg=#89b4fa,bg=#181825,nobold]█"
set -g window-status-activity-style "bg=#181825,fg=#fab387"
set -g window-status-bell-style "bg=#f38ba8,fg=#1e1e2e,bold"

set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g display-panes-colour "#9399b2"
set -g display-panes-active-colour "#f5c2e7"
set -g clock-mode-colour "#89b4fa"

# tpm plugin
set -g @plugin "tmux-plugins/tpm"

# tmux plugins
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin "omerxx/tmux-sessionx"

# initialize tpm (keep at bottom of tmux.conf)
run "~/.tmux/plugins/tpm/tpm"

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse off

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# reload config file
bind r source-file ~/.tmux.conf

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# scrolling a page up and down in copy mode
bind -n C-S-Up if-shell -F "#{pane_in_mode}" "send-keys -X page-up" "copy-mode -u"
bind -n C-S-Down if-shell -F "#{pane_in_mode}" "send-keys -X page-down" "copy-mode -u"

# Reverse search from bottom to top
bind -n C-f copy-mode \; send-keys '?'

# Use vi-style key bindings for copy mode (case-insensitive search by default)
set -g mode-keys vi

# Increase the scrollback history size for better searching
set -g history-limit 10000

